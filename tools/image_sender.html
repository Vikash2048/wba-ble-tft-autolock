<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TFT Image Sender</title>
<!-- BLE_TFT step 6: sends a photo to the NUCLEO-WBA25 TFT over Bluetooth (Web Bluetooth).
     Works in Chrome on Android. Must be opened from https:// or http://localhost
     (or with the chrome://flags "insecure origin" setting, see TFT_SETUP.md 13.11). -->
<style>
/* Layout: one narrow column, like a phone app: connect -> pick -> preview -> send */
:root {
  --bg: #eef1f3; --panel: #ffffff; --fg: #15202a; --muted: #5d6b77;
  --line: #d3dae0; --accent: #0078a8; --ok: #1d8a4a; --bad: #c0392b;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1418; --panel: #182129; --fg: #e4ebf0; --muted: #8fa0ad;
          --line: #2a3640; --accent: #2cb5e8; --ok: #3ccf7a; --bad: #ff6b5c; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans);
       padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
                max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
main { max-width: 460px; margin: 0 auto; display: grid; gap: 14px; }
h1 { font-size: 20px; margin: 4px 0 0; }
.sub { color: var(--muted); font-size: 13px; margin: 0; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 14px; display: grid; gap: 10px; }
.step { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
button, .file { font: inherit; font-weight: 600; border-radius: 8px; padding: 10px 16px;
                border: 1px solid var(--accent); background: var(--accent); color: #fff; cursor: pointer; }
button.ghost { background: transparent; color: var(--accent); }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible, .file:focus-within { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
.file input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.file { position: relative; display: inline-block; }
label.opt { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 14px; }
select { font: inherit; padding: 6px; border-radius: 6px; border: 1px solid var(--line);
         background: var(--panel); color: var(--fg); }
canvas { width: 100%; max-width: 100%; aspect-ratio: 4 / 3; border-radius: 4px;
         background: #000; image-rendering: pixelated; display: block; }
.state { font-family: var(--mono); font-size: 13px; }
.state.ok { color: var(--ok); } .state.bad { color: var(--bad); }
.bar { height: 10px; border-radius: 5px; background: var(--line); overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--accent); transition: width .15s; }
.nums { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
#log { font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: pre-wrap;
       max-height: 120px; overflow: auto; margin: 0; }
</style>
</head>
<body>
<main>
  <div>
    <h1>TFT Image Sender</h1>
    <p class="sub">Photo → 320 × 240 RGB565 → Bluetooth → NUCLEO-WBA25 display</p>
  </div>

  <section>
    <div class="step">1 · Board</div>
    <p class="sub">On the board open menu <b>7. Phone image</b> first.</p>
    <div class="row">
      <button id="connect">Connect to TFT_xx</button>
      <button id="disconnect" class="ghost" disabled>Disconnect</button>
    </div>
    <div id="conn" class="state">Not connected</div>
  </section>

  <section>
    <div class="step">2 · Picture</div>
    <div class="row">
      <label class="file" for="file">Choose photo<input id="file" type="file" accept="image/*"></label>
      <label class="opt">Fit
        <select id="fit"><option value="cover">Fill (crop)</option><option value="contain">Whole (bars)</option></select>
      </label>
      <label class="opt"><input id="dither" type="checkbox" checked> Dither</label>
    </div>
    <canvas id="cv" width="320" height="240"></canvas>
  </section>

  <section>
    <div class="step">3 · Send</div>
    <div class="row">
      <button id="send" disabled>Send to display</button>
      <button id="abort" class="ghost" disabled>Abort</button>
      <label class="opt">Packet
        <select id="chunk"><option>244</option><option>180</option><option>128</option><option>20</option></select>
      </label>
    </div>
    <div class="bar"><div id="bar"></div></div>
    <div class="nums" id="nums">0 / 153600 bytes</div>
    <div id="bstate" class="state">Board: –</div>
    <pre id="log"></pre>
  </section>
</main>

<script>
const UUID = n => `a07e00${n}-5a1e-4c0d-9e2b-7f3c1d0e2a10`;
const SVC = UUID('10'), CTRL = UUID('11'), DATA = UUID('12'), STAT = UUID('13');
const W = 320, H = 240;
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d', { willReadFrequently: true });
let dev = null, cCtrl = null, cData = null, cStat = null, img = null, sending = false, stop = false;

function log(t) { const l = $('log'); l.textContent = (t + '\n' + l.textContent).slice(0, 3000); }
function setConn(t, cls) { $('conn').textContent = t; $('conn').className = 'state ' + (cls || ''); }
function updateButtons() {
  const c = !!(dev && dev.gatt.connected);
  $('connect').disabled = c || sending || !navigator.bluetooth; $('disconnect').disabled = !c;
  $('send').disabled = !c || !img || sending; $('abort').disabled = !sending;
}

/* ---------- Bluetooth ---------- */
if (!navigator.bluetooth) {
  setConn('Web Bluetooth not available here. Use Chrome on Android, opened over https:// (see TFT_SETUP.md 13.11).', 'bad');
  $('connect').disabled = true;
}

$('connect').onclick = async () => {
  try {
    dev = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'TFT_' }], optionalServices: [SVC] });
    dev.addEventListener('gattserverdisconnected', () => { setConn('Disconnected', 'bad'); stop = true; updateButtons(); });
    setConn('Connecting to ' + dev.name + ' …');
    const srv = await dev.gatt.connect();
    const s = await srv.getPrimaryService(SVC);
    cCtrl = await s.getCharacteristic(CTRL);
    cData = await s.getCharacteristic(DATA);
    cStat = await s.getCharacteristic(STAT);
    cStat.addEventListener('characteristicvaluechanged', e => showStatus(e.target.value));
    await cStat.startNotifications();
    setConn('Connected: ' + dev.name, 'ok');
  } catch (e) {
    setConn('Connect failed: ' + e.message + (e.name === 'NotFoundError' ? '' : ' (is the board advertising? press "Advertise" on screen 5)'), 'bad');
  }
  updateButtons();
};
$('disconnect').onclick = () => { if (dev) dev.gatt.disconnect(); };

const ST = ['idle', 'receiving', 'done', 'error'];
const ERR = ['', 'screen 7 "Phone image" is not open on the board', 'bad size', 'timeout / disconnected', 'aborted'];
let boardState = 0, boardErr = 0;
function showStatus(v) {
  boardState = v.getUint8(0); boardErr = v.getUint8(1);
  const got = v.getUint32(2, true), pct = v.getUint8(6);
  const t = 'Board: ' + (ST[boardState] || boardState) + ' ' + pct + '%' + (boardState === 3 ? ' – ' + (ERR[boardErr] || boardErr) : '');
  $('bstate').textContent = t;
  $('bstate').className = 'state ' + (boardState === 2 ? 'ok' : boardState === 3 ? 'bad' : '');
  if (boardState === 3) stop = true;
}

/* ---------- Picture -> 320x240 ---------- */
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const im = new Image();
  im.onload = () => { img = im; draw(); URL.revokeObjectURL(im.src); updateButtons(); };
  im.src = URL.createObjectURL(f);
};
$('fit').onchange = $('dither').onchange = () => img && draw();

function draw() {
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const s = ($('fit').value === 'cover' ? Math.max : Math.min)(W / img.width, H / img.height);
  const w = img.width * s, h = img.height * s;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
  frame = toRgb565(); /* also redraws the canvas with the reduced colours = what the TFT will show */
}

/* RGB888 -> RGB565 little endian (low byte first, the order this panel wants).
 * Optional Floyd-Steinberg dithering hides the banding of 5/6/5 bits. */
let frame = null;
function toRgb565() {
  const id = ctx.getImageData(0, 0, W, H), p = id.data, dith = $('dither').checked;
  const f = new Float32Array(W * H * 3);
  for (let i = 0, j = 0; i < p.length; i += 4, j += 3) { f[j] = p[i]; f[j + 1] = p[i + 1]; f[j + 2] = p[i + 2]; }
  const out = new Uint8Array(W * H * 2);
  const bits = [5, 6, 5];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const k = (y * W + x) * 3, q = [];
    for (let c = 0; c < 3; c++) {
      const v = Math.min(255, Math.max(0, f[k + c])), m = (1 << bits[c]) - 1;
      const n = Math.round(v * m / 255); q[c] = n;
      const back = Math.round(n * 255 / m), err = v - back;
      p[(y * W + x) * 4 + c] = back;
      if (dith) {
        if (x + 1 < W) f[k + 3 + c] += err * 7 / 16;
        if (y + 1 < H) {
          if (x > 0) f[k + W * 3 - 3 + c] += err * 3 / 16;
          f[k + W * 3 + c] += err * 5 / 16;
          if (x + 1 < W) f[k + W * 3 + 3 + c] += err / 16;
        }
      }
    }
    const px = (q[0] << 11) | (q[1] << 5) | q[2], o = (y * W + x) * 2;
    out[o] = px & 0xff; out[o + 1] = px >> 8;
  }
  ctx.putImageData(id, 0, 0);
  return out;
}

/* ---------- Send ---------- */
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function writeNR(chunk) {
  for (let tries = 0; ; tries++) {
    try { return await cData.writeValueWithoutResponse(chunk); }
    catch (e) { if (tries > 20 || !/in progress|busy/i.test(e.message)) throw e; await sleep(10); }
  }
}

$('send').onclick = async () => {
  if (!frame) return;
  sending = true; stop = false; boardState = 0; updateButtons();
  const size = frame.length, CH = +$('chunk').value, t0 = performance.now();
  try {
    await cCtrl.writeValue(new Uint8Array([1, W & 255, W >> 8, H & 255, H >> 8]));   /* START */
    await sleep(60);
    if (boardState === 3) throw new Error(ERR[boardErr]);
    for (let off = 0; off < size && !stop; off += CH) {
      await writeNR(frame.subarray(off, Math.min(off + CH, size)));
      const sent = Math.min(off + CH, size);
      if ((off / CH) % 8 === 0 || sent === size) {
        $('bar').style.width = (100 * sent / size) + '%';
        const s = (performance.now() - t0) / 1000;
        $('nums').textContent = `${sent} / ${size} bytes · ${(sent / 1024 / s).toFixed(1)} KB/s · ${s.toFixed(1)} s`;
      }
    }
    if (stop) log('Stopped' + (boardState === 3 ? ': ' + ERR[boardErr] : ''));
    else log(`Sent ${size} bytes in ${((performance.now() - t0) / 1000).toFixed(1)} s (packet ${CH})`);
  } catch (e) {
    log('Send failed: ' + e.message + (CH > 20 ? ' – try a smaller packet size' : ''));
  }
  sending = false; updateButtons();
};

$('abort').onclick = async () => {
  stop = true;
  try { await cCtrl.writeValue(new Uint8Array([2])); } catch (e) {}
};

/* sample picture so the preview is never empty: colour bars + gradient */
(function sample() {
  const g = ctx.createLinearGradient(0, 0, W, 0);
  ['#ff0000', '#ffff00', '#00ff00', '#00ffff', '#0000ff', '#ff00ff', '#ff0000'].forEach((c, i, a) => g.addColorStop(i / (a.length - 1), c));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const v = ctx.createLinearGradient(0, 0, 0, H);
  v.addColorStop(0, 'rgba(255,255,255,0)'); v.addColorStop(1, 'rgba(0,0,0,1)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 28px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('TFT_xx  320 × 240', W / 2, H / 2);
  img = new Image(); img.onload = () => { draw(); updateButtons(); }; img.src = cv.toDataURL();
})();
updateButtons();
</script>
</body>
</html>
